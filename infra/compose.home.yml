# Halal Trader on the home stack (~/lab/home, services.toml).
#
# An OVERRIDE, layered on top of docker-compose.yml -- not a replacement. The
# fleet, the image, the migrate gate and the volumes all stay defined there, so
# this file only says how the home stack's copy differs:
#
#   1. The dashboard is published on 127.0.0.1:6010, the home stack's port for
#      this project, instead of 0.0.0.0:8082. Loopback because the reach from
#      elsewhere is the home ingress (trader.home.space / trader.elghareeb.space),
#      which holds the auth; nothing else on the LAN needs a socket.
#   2. Postgres stays on 5433 -- the test suite and `uv run` on the host both
#      expect it there -- but on loopback only.
#
# The project name stays `infra` (the directory of the first -f file), which is
# what keeps the existing `infra_pg-data` volume -- the live paper-trade
# history -- attached. Renaming the project would start an empty database.
#
# Used by the `home-*` recipes in ../justfile:
#   docker compose -f infra/docker-compose.yml -f infra/compose.home.yml ...

services:
  postgres:
    ports: !override
      - "127.0.0.1:5433:5432"

  trader-web:
    ports: !override
      - "127.0.0.1:6010:8082"
