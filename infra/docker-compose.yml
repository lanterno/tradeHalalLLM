# Halal Trader — single-host Docker Compose deployment.
#
# Services:
#   * postgres        — Postgres 16 + pgvector for the canonical DB.
#   * trader-migrate  — one-shot Alembic migrate (init container).
#   * trader-stocks   — the market-hours stock bot.
#   * trader-shadow   — the halabot shadow engine (never trades).
#   * trader-web      — the FastAPI dashboard + Prometheus /metrics.
#
# Every service shares the same Postgres instance.
#
# trader-migrate runs `halal-trader db migrate` to head, exits cleanly,
# and gates every bot's startup (`depends_on: condition: service_completed_successfully`)
# so the schema is always at head before any bot opens the engine.
#
# Optional Prometheus + Grafana sidecars are commented out — uncomment
# when an operator actually wants the dashboards. They scrape the
# /metrics endpoint exposed by the web service.
#
# ── Secrets: one .env for the operator, only what each process reads ──
# Every app service loads ../.env (env_file), and its `environment:` --
# which wins over env_file -- blanks the secrets that process never reads,
# so a compromise of the dashboard or the shadow does not hand over the
# core account's broker keys. Which process reads what (checked 2026-10-06):
#
#   trader-stocks  everything except WEB_API_TOKEN
#   trader-shadow  ALPACA_* (bars via the MCP server), GLM_*, FINNHUB, FRED
#   trader-web     WEB_API_TOKEN, TELEGRAM_* (the watchdog), ALPACA_* and
#                  GLM_* (the dashboard's "generate recommendation" button)
#   trader-migrate nothing but the database
#
# A new secret a process does not need goes into its blank list here.
#
# POSTGRES_PASSWORD: read from the shell or from the repo's .env -- the
# justfile passes `--env-file .env` -- with the dev default as a fallback.
# DATABASE_URL is built from it for every container, so it is the one value
# to set. Changing it on an existing volume also needs ALTER USER (Postgres
# only reads POSTGRES_PASSWORD when it creates the database).

x-database-url: &database-url
  # Inside the compose network the services reach Postgres at its service
  # name and internal port, whatever the host's own DATABASE_URL says.
  DATABASE_URL: postgresql+asyncpg://trader:${POSTGRES_PASSWORD:-trader-dev-only}@postgres:5432/halal_trader
  POSTGRES_PASSWORD: ""

# Read by nothing at all: the crypto-era and never-built integrations' keys.
x-unused-keys: &unused-keys
  BINANCE_API_KEY: ""
  BINANCE_SECRET_KEY: ""
  COINGECKO_API_KEY: ""
  CRYPTOPANIC_API_KEY: ""
  ETHERSCAN_API_KEY: ""
  REDDIT_CLIENT_ID: ""
  REDDIT_CLIENT_SECRET: ""
  SLACK_WEBHOOK_URL: ""
  DISCORD_WEBHOOK_URL: ""

# The core portfolio's account (it trades real money once CORE_PAPER=false)
# and the live-mode arming token: only trader-stocks reads them.
x-core-keys: &no-core-keys
  CORE_ALPACA_API_KEY: ""
  CORE_ALPACA_SECRET_KEY: ""
  LIVE_MODE_CONFIRMATION: ""

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: halal-trader-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: halal_trader
      POSTGRES_USER: trader
      # Set POSTGRES_PASSWORD in .env (see the secrets note above); the
      # default is for a fresh local checkout only.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader-dev-only}
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d halal_trader"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot Alembic migrate. Runs to head, exits, gates every bot.
  trader-migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      args:
        EXTRAS: "ml"
    image: halal-trader:latest
    container_name: trader-migrate
    restart: "no"
    env_file:
      - ../.env
    environment:
      <<: [*database-url, *unused-keys, *no-core-keys]
      ALPACA_API_KEY: ""
      ALPACA_SECRET_KEY: ""
      GLM_API_KEY: ""
      GLM_FALLBACK_API_KEY: ""
      FINNHUB_API_KEY: ""
      FRED_API_KEY: ""
      ZOYA_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      WEB_API_TOKEN: ""
    command: ["halal-trader", "db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  trader-stocks:
    image: halal-trader:latest
    container_name: trader-stocks
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: [*database-url, *unused-keys]
      WEB_API_TOKEN: ""
    volumes:
      - trader-data:/app/data
      - trader-logs:/app/logs
    command: ["halal-trader", "start"]
    # PID 1 in a container ignores signals it has no handler for; the bot now
    # installs one, and `init` (tini) forwards signals and reaps the broker
    # subprocess. The grace period gives shutdown() time to cancel the
    # monitor/reactor and close the broker before docker sends SIGKILL.
    init: true
    stop_grace_period: 30s
    # "unhealthy" in `docker ps` when the run loop stops beating (it beats
    # every 60 s), not only when the process exits. Docker does not restart
    # on it; the web's watchdog is what alerts.
    healthcheck:
      test: ["CMD", "python", "-m", "halal_trader.core.healthcheck", "stock.process", "180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s
    depends_on:
      trader-migrate:
        condition: service_completed_successfully

  # Shadow engine — the always-on Sense→Understand→Convict→Act loop that keeps
  # the belief board (/beliefs) + hb_* tables live. READ-ONLY / advisory: it
  # NEVER trades (the execution layer is dormant; ENGINE_LIVE stays unset).
  # Replaces the macOS launchd `com.halabot.shadow` job (`halabot shadow
  # --interval 900`). Docker's restart policy replaces the launchd watchdog.
  trader-shadow:
    image: halal-trader:latest
    container_name: trader-shadow
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: [*database-url, *unused-keys, *no-core-keys]
      WEB_API_TOKEN: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      # Only `--rescreen-compliance` reads it, and the command below omits it.
      ZOYA_API_KEY: ""
    volumes:
      - trader-data:/app/data
      - trader-logs:/app/logs
    command: ["halabot", "shadow", "--interval", "900"]
    # PID 1 in a container ignores signals it has no handler for; the bot now
    # installs one, and `init` (tini) forwards signals and reaps the broker
    # subprocess. The grace period gives shutdown() time to cancel the
    # monitor/reactor and close the broker before docker sends SIGKILL.
    init: true
    stop_grace_period: 30s
    # The shadow beats shadow.process every 60 s from its event loop.
    healthcheck:
      test: ["CMD", "python", "-m", "halal_trader.core.healthcheck", "shadow.process", "180"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    depends_on:
      trader-migrate:
        condition: service_completed_successfully

  trader-web:
    image: halal-trader:latest
    container_name: trader-web
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      <<: [*database-url, *unused-keys, *no-core-keys]
      FINNHUB_API_KEY: ""
      FRED_API_KEY: ""
      ZOYA_API_KEY: ""
    ports:
      - "8082:8082"
    volumes:
      - trader-data:/app/data
      - trader-logs:/app/logs
    command:
      - "uvicorn"
      - "halal_trader.web.app:create_app"
      - "--factory"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8082"
    healthcheck:
      # Probe the FastAPI app — restarts the container if the API
      # stops responding even though the process is technically alive
      # (e.g. an asyncio deadlock that the OS process supervisor
      # can't see).
      test:
        - "CMD-SHELL"
        - "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8082/api/health', timeout=3).status == 200 else 1)\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      trader-migrate:
        condition: service_completed_successfully

  # ── Optional observability stack ──
  # prometheus:
  #   image: prom/prometheus:latest
  #   restart: unless-stopped
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #   command:
  #     - "--config.file=/etc/prometheus/prometheus.yml"
  #   ports:
  #     - "9090:9090"
  #
  # grafana:
  #   image: grafana/grafana:latest
  #   restart: unless-stopped
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana-data:/var/lib/grafana

volumes:
  pg-data:
  trader-data:
  trader-logs:
  # grafana-data:
