[project]
name = "halal-trader"
version = "0.2.0"
description = "LLM-powered halal stock-trading bot (Alpaca)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Core
    "mcp>=1.0,<2.0",
    "httpx",
    "pydantic-settings",
    # Data / ORM
    "sqlmodel",
    "greenlet",
    "alembic",
    # Scheduling
    "apscheduler>=3.10",
    # CLI
    "click",
    "rich",
    # OpenAI-compatible client — talks to GLM-5.2 endpoints (OpenRouter/Z.ai)
    "openai",
    # Indicator / risk maths
    "numpy",
    # Logging
    "python-json-logger",
    # Timezone data (required on minimal/WSL systems without system tzdata)
    "tzdata",
    "uvicorn>=0.40.0",
    "fastapi>=0.135.1",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.3",
    "pgvector>=0.4.2",
    "hijridate>=2.6.0",
]

[project.optional-dependencies]
ml = [
    "torch",
    "scikit-learn",
    "chronos-forecasting",
    # GARCH-FHS path-extreme bands (quant roadmap Phase 2). Pulls
    # pandas/scipy/statsmodels transitively — acceptable inside [ml] only;
    # the deterministic quant/ core stays pure numpy.
    "arch>=8.0",
]
all = [
    "halal-trader[ml]",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "ruff",
    "mypy",
    "pre-commit",
]

[project.scripts]
halal-trader = "halal_trader.cli:cli"
halabot = "halabot.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halal_trader", "src/halabot"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# BLE: an `except Exception` that swallows names why (noqa: BLE001 — why).
# RUF100: a noqa that suppresses nothing goes.
select = ["E", "F", "I", "W", "UP", "B", "C4", "PIE", "PERF", "BLE", "RUF100"]
# B905: zip(strict=) would turn a silent length mismatch into a crash on a
# live path; adding it is a behaviour change, made case by case, not by lint.
ignore = [
    "B905",
    "UP042",  # StrEnum changes what str(member) prints
    "UP047",  # PEP 695 generics: churn without a reader benefit yet
    "C408",  # dict(a=1) reads fine and is common in fixtures
    "PERF401",  # loop-and-append is often the clearer form
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Typer dependency markers are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# pytest.raises(Exception) is deliberate where any failure is the contract,
# and a test may catch whatever it provokes.
"tests/**" = ["B017", "BLE001"]
"src/halal_trader/web/app.py" = ["E501"]
# Email renderer has a multi-line HTML template f-string where
# wrapping each inline-styled tag would hurt readability without
# changing the rendered output.
"src/halal_trader/notifications/email.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    # AsyncMock auto-creates child AsyncMock attributes the first time they're
    # touched (in `if`-guards, attribute lookups, etc.); the resulting
    # coroutines never get awaited because the access never escalated to a
    # call. These are mock-plumbing artifacts in tests, not production bugs.
    "ignore:coroutine 'AsyncMockMixin\\._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
# The pure HTTP wrapper under core/llm/ (glm.py, base.py, factory.py) is
# exercised end-to-end by the live bot run rather than in pytest, so
# leaving it out keeps the report honest.
omit = [
    "src/halal_trader/core/llm/base.py",
    "src/halal_trader/core/llm/factory.py",
    "src/halal_trader/core/llm/glm.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ── mypy ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.14"
# All of src, strict: every package was brought clean on 2026-10-24, so a new
# module is checked from its first commit.
files = ["src/halal_trader", "src/halabot"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true
strict = true

# ── uv: CPU-only PyTorch ──
# The default torch wheel on linux/x86_64 drags in ~2GB of nvidia-*-cu12 CUDA
# libraries as dependencies. Nothing here needs a GPU — Chronos-bolt-small,
# scikit-learn and FinBERT all run fine on CPU — and the Docker
# runtime has no GPU passthrough, so pin torch to the CPU wheel index. This
# drops the CUDA libs from the lock and keeps the `ml` image lean. `explicit`
# scopes the index to torch only (it isn't consulted for other packages).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
