name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: halal_trader
          POSTGRES_USER: trader
          POSTGRES_PASSWORD: trader-dev-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U trader -d halal_trader"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # tests/conftest.py reads these to reach the service container.
      TEST_PG_HOST: localhost
      TEST_PG_PORT: "5433"
      TEST_PG_USER: trader
      TEST_PG_PASS: trader-dev-only
      TEST_PG_DB: halal_trader_test
      DATABASE_URL: postgresql+asyncpg://trader:trader-dev-only@localhost:5433/halal_trader

    timeout-minutes: 25

    # Every check runs even when an earlier one fails (`success() || failure()`):
    # from May to October 2026 a red Lint/Format step stopped the job before
    # mypy or pytest ever ran, so five months of pushes were never tested.
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.14
        run: uv python install 3.14

      # --locked: fail if pyproject.toml and uv.lock disagree, instead of
      # silently re-resolving to versions nobody tested locally.
      - name: Install dependencies (dev + all extras)
        run: uv sync --locked --extra dev --extra all

      # Known vulnerabilities in the locked dependencies, and in the broker
      # server's frozen closure baked into the image. Advisory for now: the
      # lock carries open advisories, and a new one must not block every push
      # until an upgrade exists. Read the step's output.
      - name: Dependency audit (pip-audit, advisory)
        if: success() || failure()
        continue-on-error: true
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r infra/alpaca-mcp-server.txt

      - name: Lint
        if: success() || failure()
        run: uv run ruff check src/ tests/

      - name: Format check
        if: success() || failure()
        run: uv run ruff format --check src/ tests/

      - name: Type check (strict gate in pyproject)
        if: success() || failure()
        run: uv run mypy

      - name: Apply Alembic migrations to runtime DB
        if: success() || failure()
        run: uv run halal-trader db migrate

      - name: Test (coverage over all of src)
        if: success() || failure()
        run: >
          uv run pytest -q -n auto
          --cov=src/halal_trader
          --cov=src/halabot
          --cov-report=term-missing:skip-covered

      # The historical gate (domain + core >= 85%) stays as the floor while
      # the live-path packages are brought up to it; the full report above is
      # what to read.
      - name: Coverage gate (domain + core >= 85%)
        if: success() || failure()
        run: >
          uv run coverage report
          --include='src/halal_trader/domain/*,src/halal_trader/core/*'
          --fail-under=85

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        if: success() || failure()
        run: npm run lint

      # `npm run build` type-checks (tsc -b) and then bundles with Vite.
      - name: Type check and build
        if: success() || failure()
        run: npm run build
